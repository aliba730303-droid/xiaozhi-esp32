name: Build Haj Ali on upstream XiaoZhi main
# Source pinned to upstream commit 831ffd14188553cc887408b75396ae38618538e0

on:
  workflow_dispatch:
  push:
    branches:
      - hajali-v2.2.2-idf5.5.4

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout Haj Ali overlay
        uses: actions/checkout@v4

      - name: Get upstream XiaoZhi main
        shell: bash
        run: |
          git clone https://github.com/78/xiaozhi-esp32.git upstream
          cd upstream
          git checkout 831ffd14188553cc887408b75396ae38618538e0
          test "$(git rev-parse HEAD)" = "831ffd14188553cc887408b75396ae38618538e0"

      - name: Apply Haj Ali board files
        shell: bash
        run: |
          cp main/boards/bread-compact-wifi/compact_wifi_board.cc upstream/main/boards/bread-compact-wifi/
          cp main/boards/bread-compact-wifi/config.h upstream/main/boards/bread-compact-wifi/
          cp main/boards/bread-compact-wifi/water_heater_controller.cc upstream/main/boards/bread-compact-wifi/
          cp main/boards/bread-compact-wifi/water_heater_controller.h upstream/main/boards/bread-compact-wifi/
          cat > upstream/main/boards/bread-compact-wifi/config.json <<'EOF'
          {
            "type": "bread-compact-wifi",
            "target": "esp32s3",
            "builds": [
              {
                "name": "bread-compact-wifi",
                "sdkconfig_append": [
                  "CONFIG_USE_HOTSPOT_WIFI_PROVISIONING=y",
                  "CONFIG_USE_ACOUSTIC_WIFI_PROVISIONING=n",
                  "CONFIG_USE_ESP_BLUFI_WIFI_PROVISIONING=n"
                ]
              }
            ]
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/sdkconfig.defaults.esp32s3")
          s = p.read_text()
          s = s.replace("CONFIG_ESPTOOLPY_FLASHMODE_QIO=y", "CONFIG_ESPTOOLPY_FLASHMODE_QIO=n\\nCONFIG_ESPTOOLPY_FLASHMODE_DIO=y")
          if "CONFIG_ESPTOOLPY_FLASHFREQ_80M=y" not in s:
              s += "\\nCONFIG_ESPTOOLPY_FLASHFREQ_80M=y\\n"
          if "CONFIG_I2C_ENABLE_SLAVE_DRIVER_VERSION_2=y" not in s:
              s += "CONFIG_I2C_ENABLE_SLAVE_DRIVER_VERSION_2=y\\n"
          p.write_text(s)
          PY

      - name: Build Haj Ali firmware
        shell: bash
        working-directory: upstream
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi --language fa-IR --zip
          test -s build/merged-binary.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Haj-Ali-XiaoZhi-main-IDF6.1-ESP32-S3-N16R8
          path: |
            upstream/build/merged-binary.bin
            upstream/releases/*.zip
          if-no-files-found: error
